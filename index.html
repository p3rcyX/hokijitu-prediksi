function status(){let label=source.start?dateLabel(source.start):'';if(source.start&&source.end&&source.start!==source.end)label=source.start.slice(0,7)===source.end.slice(0,7)?Number(source.start.slice(8))+'–'+dateLabel(source.end):dateLabel(source.start)+' — '+dateLabel(source.end);$('title').textContent='Jadwal Bola'+(label?' '+label:'');const today=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Jakarta'}).format(new Date());let text=data.archive?'Arsip contoh · Bukan data terbaru':source.start&&source.end&&source.start<=today&&today<=source.end?'Edisi '+label:'Arsip prediksi · '+(label||'Tanggal belum tersedia');const checked=data.checked_at||data.fetched_at;if(checked&&!data.archive){const d=new Date(checked);if(!Number.isNaN(d.valueOf())){text+=' · Diperiksa '+dateLabel(checked)+', '+new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Asia/Jakarta'}).format(d)+' WIB';if(Date.now()-d.valueOf()>1800000)text+=' · Pembaruan belum terkonfirmasi dalam 30 menit terakhir';}}$('status').textContent=error?'Data tidak dapat dibaca. Silakan muat ulang halaman.':text;}
function team(name,url,away){const t=el('span','team'+(away?' away':'')),badge=el('span','badge'),initials=String(name||'').replace(/\[.*?\]|\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'FC';badge.textContent=initials;badge.setAttribute('aria-hidden','true');try{const u=new URL(url);if(['https:','http:'].includes(u.protocol)&&!u.username&&!u.password){const img=el('img');img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>{badge.classList.remove('real');badge.textContent=initials;},{once:true});img.src=u.href;badge.replaceChildren(img);badge.classList.add('real');}}catch(e){}t.append(badge,el('span','name',name));return t;}
function match(m){const tr=el('tr'),when=el('td','when');let time='—',day=m.date?dateLabel(m.date):'Belum pasti';if(m.kickoff){const d=new Date(m.kickoff);if(!Number.isNaN(d.valueOf())){time=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Asia/Jakarta'}).format(d).replace('.',':');day=new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'2-digit',timeZone:'Asia/Jakarta'}).format(d);}}when.append(el('strong','',time),el('span','',day));const teamsCell=el('td'),teams=el('div','teams');teams.append(team(m.tim_home,m.logo_home,false),el('span','versus','vs'),team(m.tim_away,m.logo_away,true));teamsCell.append(teams);const score=el('td');if(m.pred&&m.skor){const detail=el('details','score'),summary=el('summary','',m.skor.replace('-', ' : '));summary.setAttribute('aria-label','Prediksi '+m.tim_home+' vs '+m.tim_away+': '+m.skor+'. Buka detail.');const dl=el('dl');for(const [label,key]of[['Handicap','hdp'],['Total gol','ou'],['Hasil 1X2','1x2']]){const d=el('div');d.append(el('dt','',label),el('dd','',m.pred[key]));dl.append(d);}detail.append(summary,dl);score.append(detail);}else score.append(el('span','unavailable','Belum tersedia'));tr.append(when,teamsCell,score);return tr;}
function render(){const q=normalize($('teamSearch').value),league=$('leagueFilter').value,filtered=rows.filter(m=>(league==='all'||m.liga===league)&&normalize(m.tim_home+' '+m.tim_away).includes(q)),groups=new Map();filtered.forEach(m=>{if(!groups.has(m.liga))groups.set(m.liga,[]);groups.get(m.liga).push(m);});$('leagues').replaceChildren();for(const[name,matches]of groups){const section=el('section','league'),heading=el('h2','',name),table=el('table'),cols=el('colgroup');for(const cls of ['when','match','prediction'])cols.append(el('col',cls));const thead=el('thead'),titles=el('tr');for(const title of ['TANGGAL / WAKTU','PERTANDINGAN','PREDIKSI SKOR']){const th=el('th','',title);th.scope='col';titles.append(th);}thead.append(titles);const tbody=el('tbody');matches.forEach(m=>tbody.append(match(m)));table.setAttribute('aria-label',name);table.append(cols,thead,tbody);section.append(heading,table);$('leagues').append(section);}$('count').textContent=filtered.length+' pertandingan · '+groups.size+' liga';$('empty').hidden=filtered.length>0;if(!rows.length){$('emptyTitle').textContent='Belum ada pertandingan';$('emptyText').textContent='Prediksi akan tampil setelah data tersedia.';$('reset').hidden=true;}}
for(const name of new Set(rows.map(m=>m.liga))){const option=el('option','',name);option.value=name;$('leagueFilter').append(option);}$('leagueFilter').addEventListener('change',render);$('teamSearch').addEventListener('input',render);$('reset').addEventListener('click',()=>{$('leagueFilter').value='all';$('teamSearch').value='';render();$('teamSearch').focus();});status();render();setInterval(status,60000);
</script></body></html>
